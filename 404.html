<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — AccessLayer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1742c9">
<link rel="icon" type="image/svg+xml" href="./demo/logo.svg">
<link rel="stylesheet" href="./demo/site.css">
<link rel="stylesheet" href="./demo/landing.css">
<link rel="stylesheet" href="./demo/landing-c.css">
<link rel="stylesheet" href="./demo/not-found.css">
</head>
<body class="theme-c not-found">

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="AccessLayer, home">
      <img class="brand-mark" src="./demo/logo.svg" alt="" width="34" height="34">
      <span>AccessLayer</span>
    </a>
    <a class="btn btn-primary btn-sm" href="/console/">Get started</a>
  </div>
</header>

<main id="main">
  <section class="hero" aria-labelledby="not-found-title">
    <div class="wrap">
      <p class="not-found-code" aria-hidden="true">404</p>
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Page not found
      </p>
      <h1 id="not-found-title" class="hero-title">There's <mark>nothing</mark> at this address.</h1>
      <p class="lead">
        The page may have moved, or the link may be mistyped. The widget and the
        console are right where they were.
      </p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">
          Go to the home page
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
        <a class="btn btn-ghost" href="/console/">Set up a website</a>
      </div>
    </div>
  </section>
</main>

</body>
</html>
